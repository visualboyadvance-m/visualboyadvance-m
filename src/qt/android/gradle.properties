# Project-wide Gradle settings for the APK build.
#
# androiddeployqt copies its own gradle.properties here and then appends the
# values it computes (SDK/NDK versions, ABI list, package name, ...). A file of
# this name in QT_ANDROID_PACKAGE_SOURCE_DIR *replaces* that copy rather than
# adding to it, so the settings Qt's template carries have to be repeated here
# -- notably the daemon heap size and android.useAndroidX, which the manifest
# needs for androidx.core.content.FileProvider.

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Allow AndroidX usage
android.useAndroidX=true

# Quiet the gradle build. The Java sources under src/org/libsdl/app are SDL's
# upstream Android glue, vendored verbatim, and javac reports ~75 deprecation
# and auxiliaryclass warnings in them: Bluetooth GATT calls, the
# OnSystemUiVisibilityChangeListener API, Intent.getParcelableExtra. None of
# that is ours to fix, and editing the copies would only make them diverge from
# SDL. The Android Gradle plugin adds a warning of its own about a compile SDK
# newer than it was tested against. Errors still print at this level, so a
# failing APK build still says why.
org.gradle.logging.level=quiet
