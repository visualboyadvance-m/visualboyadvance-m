name: Visual Studio
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # arm64 builds natively on the Windows 11 Arm image, so its tests run
        # there too; a cross build from x64 can only link them. The VS 2026
        # image matches what windows-latest gives the x64 and x86 jobs, and
        # the nightly server's arm64-windows-static vcpkg packages are laid
        # out for that toolset (no v143/ subdirectory).
        msvc_arch: ['x64', 'amd64_x86', 'arm64']
        # TODO: Re-add "Visual Studio 17 2022" once it's working.
        cmake_generator: ['Ninja']
        build_type: [release, debug]
        build_options: [default, link_off, translations_only]
        include:
          - cmake_build: '-DCMAKE_BUILD_TYPE=Release'
            build_type: release
          - cmake_build: '-DCMAKE_BUILD_TYPE=Debug'
            build_type: debug
          - cmake_options: '-DENABLE_SDL=ON -DENABLE_LIBRETRO=ON'
            build_options: default
          - cmake_options: '-DENABLE_LINK=OFF -DENABLE_SDL=ON -DENABLE_LIBRETRO=ON'
            build_options: link_off
          - cmake_options: '-DTRANSLATIONS_ONLY=ON'
            build_options: translations_only
          - cmake_vcpkg_triplet: 'x64-windows-static'
            msvc_arch: x64
          - cmake_vcpkg_triplet: 'x86-windows-static'
            msvc_arch: amd64_x86
          - cmake_vcpkg_triplet: 'arm64-windows-static'
            msvc_arch: arm64
            runner: windows-11-vs2026-arm
        exclude:
          # Exclude debug/translations_only build
          - build_type: debug
            build_options: translations_only
          - build_type: release
            build_options: translations_only
            msvc_arch: amd64_x86
          - build_type: release
            build_options: translations_only
            msvc_arch: arm64
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      # Every job uses a real Info-ZIP zip, found before the fallback that
      # compiles zip.exe from zip.ps1 (ps12exe) is considered, so the three
      # arches are set up identically. The Windows 11 Arm image has no
      # Windows PowerShell 5.1, which that fallback relies on; a zip on PATH
      # also lets wxrc find it.
      #
      # The community feed hands out 503s often enough to break a build, and
      # `choco install` exits 0 when it resolved nothing at all, which leaves
      # Configure to fail much later against the fallback instead. Retry the
      # install, then check that a zip really did land on PATH.
      - name: Install zip
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
              if (Get-Command zip -ErrorAction Ignore) { exit 0 }
              if ($attempt -gt 1) { Start-Sleep -Seconds (15 * ($attempt - 1)) }
              choco install zip -y --no-progress
          }

          if (Get-Command zip -ErrorAction Ignore) { exit 0 }

          throw 'zip was not installed; the Chocolatey community feed is probably down'

      - name: Configure
        run: >-
          cmake -B build -G ${{ matrix.cmake_generator }} -DVCPKG_TARGET_TRIPLET=${{ matrix.cmake_vcpkg_triplet }} ${{ matrix.cmake_build }} ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build build

      # Run tests
      - if: matrix.build_options == 'default'
        name: Run tests
        run: cd build && ctest -j --output-on-failure
